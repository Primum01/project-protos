<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ──────────────────────────────────────────────────── -->
    <title>TwinSpace — Interactive 3D Property Tours for Hosts</title>
    <meta
      name="description"
      content="TwinSpace turns any property into an immersive 3D tour guests can explore before they arrive. Increase bookings, reduce questions, and wow your guests from the first click."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.twinspace360.com/" />

    <!-- ── Open Graph ───────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TwinSpace" />
    <meta property="og:title" content="TwinSpace — Interactive 3D Property Tours for Hosts" />
    <meta
      property="og:description"
      content="TwinSpace turns any property into an immersive 3D tour guests can explore before they arrive. Increase bookings, reduce questions, and wow your guests from the first click."
    />
    <meta property="og:url" content="https://www.twinspace360.com/" />
    <meta property="og:image" content="https://www.twinspace360.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TwinSpace — Interactive 3D Property Tours for Hosts" />
    <meta
      name="twitter:description"
      content="TwinSpace turns any property into an immersive 3D tour guests can explore before they arrive."
    />
    <meta name="twitter:image" content="https://www.twinspace360.com/og-image.png" />

    <!-- ── Structured Data (JSON-LD) ────────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TwinSpace",
        "url": "https://www.twinspace360.com",
        "description": "TwinSpace turns any property into an immersive 3D tour guests can explore before they arrive.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "KES",
          "description": "Free plan available — start with one property tour at no cost."
        },
        "provider": {
          "@type": "Organization",
          "name": "TwinSpace",
          "url": "https://www.twinspace360.com",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "info@twinspace360.com"
          }
        }
      }
    </script>

    <!-- ── Favicon & app icons ───────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2D7B8C" />


    <!-- ── Fonts ────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking font load: browser paints immediately, fonts swap in -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
