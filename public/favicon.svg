<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#2D7B8C"/>

  <!-- Concentric circles — 360° eye motif (white) -->
  <!-- Outer ring -->
  <circle cx="256" cy="220" r="150" fill="none" stroke="white" stroke-width="14"/>
  <!-- Middle ring -->
  <circle cx="256" cy="220" r="100" fill="none" stroke="white" stroke-width="12"/>
  <!-- Inner ring -->
  <circle cx="256" cy="220" r="52"  fill="none" stroke="white" stroke-width="10"/>
  <!-- Centre dot -->
  <circle cx="256" cy="220" r="22"  fill="white"/>

  <!-- "TS" lettermark -->
  <text
    x="256" y="430"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="88"
    font-weight="700"
    letter-spacing="8"
    fill="white"
    text-anchor="middle"
  >TS</text>
</svg>